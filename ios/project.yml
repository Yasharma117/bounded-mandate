name: BoundedMandate
options:
  bundleIdPrefix: dev.yasharma
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  BoundedMandate:
    type: application
    platform: iOS
    sources:
      - path: BoundedMandate
    info:
      path: BoundedMandate/Info.plist
      properties:
        CFBundleDisplayName: Warden
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: >-
          Warden uses the microphone so you can speak your spending
          rules and orders instead of typing them.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yasharma.boundedmandate
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"

  BoundedMandateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BoundedMandateTests
    dependencies:
      - target: BoundedMandate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yasharma.boundedmandate.tests
        GENERATE_INFOPLIST_FILE: "YES"

  # Taps, not assertions about taps. The unit target decodes payloads; this one
  # drives the app the way a person does, because three surfaces in this build
  # (the ledger tally, the rule editor, the product sheet) are only reachable
  # through a gesture and were shipped unlooked-at as a result.
  BoundedMandateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BoundedMandateUITests
    dependencies:
      - target: BoundedMandate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yasharma.boundedmandate.uitests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  BoundedMandate:
    build:
      targets:
        BoundedMandate: all
        BoundedMandateTests: [test]
        BoundedMandateUITests: [test]
    test:
      targets: [BoundedMandateTests]

  # Kept off the default scheme's test action on purpose: these need the engine
  # answering on :8117, so they must not break `xcodebuild test` in CI.
  BoundedMandateUI:
    build:
      targets:
        BoundedMandate: all
        BoundedMandateUITests: [test]
    test:
      targets: [BoundedMandateUITests]
