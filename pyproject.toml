[project]
name = "bounded-mandate"
version = "0.1.0"
description = "Authorization layer between an autonomous buying agent and money."
requires-python = ">=3.11"
dependencies = [
    "openai>=3.3.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
